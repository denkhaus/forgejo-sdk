name: integration

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  testing:
    runs-on: ubuntu-latest
    container: catthehacker/ubuntu:act-22.04
    env:
      GOPROXY: "https://proxy.golang.org,direct"
      GO111MODULE: "on"
      HTTP_PROXY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"
          check-latest: true
      - run: make clean
      - run: make vet
      - run: make ci-lint
      - run: make build
      # `make test` is self-contained: it downloads the forgejo v16.0.2 binary
      # via test-instance-start, runs it on localhost:3000, waits for it, then
      # runs the suite. No external service container needed (act_runner's
      # service-container networking is unreliable here).
      - run: make test
