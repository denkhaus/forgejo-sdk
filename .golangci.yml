linters:
  enable-all: false
  disable-all: true
  fast: false
  enable:
    - bidichk
    - depguard
    - dupl
    - errcheck
    - gocritic
    - gofmt
    - gofumpt
    - gosimple
    - govet
    - ineffassign
    - nakedret
    - nolintlint
    - revive
    - staticcheck
    - stylecheck
    - tenv
    - testifylint
    - typecheck
    - unconvert
    - unused
    - unparam
    - wastedassign

run:
  timeout: 10m

output:
  sort-results: true
  sort-order: [file]
  show-stats: true

linters-settings:
  stylecheck:
    checks: ["all", "-ST1005", "-ST1003"]
  nakedret:
    max-func-lines: 0
  gocritic:
    disabled-checks:
      - ifElseChain
  revive:
    severity: error
    rules:
      - name: atomic
      - name: bare-return
      - name: blank-imports
      - name: constant-logical-expr
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: duplicated-imports
      - name: empty-lines
      - name: error-naming
      - name: error-return
      - name: error-strings
      - name: errorf
      - name: exported
      - name: identical-branches
      - name: if-return
      - name: increment-decrement
      - name: indent-error-flow
      - name: modifies-value-receiver
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: redefines-builtin-id
      - name: string-of-int
      - name: superfluous-else
      - name: time-naming
      - name: unconditional-recursion
      - name: unexported-return
      - name: unreachable-code
      - name: var-declaration
      - name: var-naming
      - name: redefines-builtin-id
        disabled: true
  gofumpt:
    extra-rules: true
  depguard:
    rules:
      main:
        deny:
          - pkg: io/ioutil
            desc: use os or io instead
          - pkg: golang.org/x/exp
            desc: it's experimental and unreliable
  testifylint:
    disable:
      - go-require

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs: [node_modules, public, web_src]
  exclude-case-sensitive: true